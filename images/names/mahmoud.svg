<svg xmlns="http://www.w3.org/2000/svg" viewBox="345 150 330 245">
  <defs>
    <!-- Solid Cream Background Matching Reference Color -->
    <style>
      .mh-text { font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif; font-weight: bold; font-size: 190px; direction: rtl; }
    </style>

    <!-- Gradients for 3D Golden Metallic Effect -->
    <linearGradient id="mh-goldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89c" />
      <stop offset="30%" stop-color="#f3cb69" />
      <stop offset="70%" stop-color="#e0a338" />
      <stop offset="100%" stop-color="#b87b1c" />
    </linearGradient>

    <linearGradient id="mh-goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d49b29" />
      <stop offset="100%" stop-color="#5a3106" />
    </linearGradient>

    <linearGradient id="mh-goldSide" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#693c0c" />
      <stop offset="50%" stop-color="#3d2003" />
      <stop offset="100%" stop-color="#1f0f01" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="mh-shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#3a220b" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- Sparkle Graphic -->
    <g id="mh-sparkle">
      <path d="M0,-12 Q0,0 12,0 Q0,0 0,12 Q0,0 -12,0 Q0,0 0,-12 Z" fill="#ffffff" opacity="0.9" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </defs>

  <g transform="translate(500, 290)" filter="url(#mh-shadow3D)">
    
    <!-- 1. Deep 3D Extrusion Layers (Dark Bronze Sides) -->
    <g fill="url(#mh-goldSide)">
      <text class="mh-text" text-anchor="middle" x="12" y="12">محمود</text>
      <text class="mh-text" text-anchor="middle" x="10" y="10">محمود</text>
      <text class="mh-text" text-anchor="middle" x="8" y="8">محمود</text>
      <text class="mh-text" text-anchor="middle" x="6" y="6">محمود</text>
      <text class="mh-text" text-anchor="middle" x="4" y="4">محمود</text>
      <text class="mh-text" text-anchor="middle" x="2" y="2">محمود</text>
    </g>

    <!-- 2. Outer Bevel Contour Stroke -->
    <text class="mh-text" text-anchor="middle" x="0" y="0" fill="none" stroke="url(#mh-goldBevel)" stroke-width="6" stroke-linejoin="round">محمود</text>

    <!-- 3. Front Golden Metallic Face -->
    <text class="mh-text" text-anchor="middle" x="0" y="0" fill="url(#mh-goldFace)">محمود</text>

    <!-- 4. Inner Shimmer Highlight Stroke -->
    <text class="mh-text" text-anchor="middle" x="0" y="0" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-dasharray="20 10 5 10">محمود</text>

  </g>

  <!-- Golden Sparkles / Lens Flares -->
  <use href="#mh-sparkle" x="320" y="190" transform="scale(1.2)" />
  <use href="#mh-sparkle" x="650" y="220" transform="scale(0.8)" />
  <use href="#mh-sparkle" x="440" y="265" transform="scale(1)" />
  <use href="#mh-sparkle" x="220" y="280" transform="scale(0.9)" />
</svg>
